<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Business Card | Lafayette Sound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    @page { size: 3.5in 2in; margin: 0; }

    body {
      background: #18181b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 48px;
      padding: 80px 24px;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #52525b;
      margin-bottom: -36px;
    }

    .card-scale { transform: scale(2.8); transform-origin: center center; margin: 100px 0; }

    .card {
      width: 3.5in;
      height: 2in;
      background: #2c2c2e;
      position: relative;
      overflow: hidden;
    }

    /* ── FRONT ── */
    .front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .front::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: #dc2626;
    }

    .front::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #27272a, transparent);
    }

    .front .logo {
      height: 28px;
      width: auto;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .front .accent-line {
      width: 24px;
      height: 2px;
      background: #dc2626;
      margin-bottom: 8px;
    }

    .front .tagline {
      font-size: 5.5pt;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #71717a;
    }

    /* ── BACK ── */
    .back {
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    .back-stripe {
      width: 4px;
      background: #dc2626;
      flex-shrink: 0;
    }

    .back-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.2in 0.25in;
      gap: 7px;
    }

    .back-name {
      font-size: 9pt;
      font-weight: 800;
      color: #fafafa;
      letter-spacing: -0.01em;
      margin-bottom: 1px;
    }

    .back-divider {
      width: 20px;
      height: 1px;
      background: #dc2626;
    }

    .back-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back-row svg {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      color: #ef4444;
    }

    .back-row span {
      font-size: 6pt;
      color: #a1a1aa;
    }

    .back-website {
      font-size: 6.5pt;
      font-weight: 700;
      color: #ef4444;
      margin-top: 1px;
    }

    .back-qr-area {
      width: 0.85in;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 1px solid #1e1e22;
      padding: 0.15in;
    }

    .back-qr-area svg {
      width: 100%;
      height: auto;
    }

    .print-controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .print-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #fafafa;
      background: #dc2626;
      border: none;
      padding: 10px 28px;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .print-btn:hover { background: #b91c1c; }

    @media print {
      body { background: none; min-height: auto; padding: 0; gap: 0; }
      .card-scale { transform: none; margin: 0; }
      .label, .print-controls { display: none; }
      .front-page { page-break-after: always; }
    }
  </style>
</head>
