<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.meta_description | default: site.description }}" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" type="image/png" href="/assets/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Lafayette Sound" />
  <link rel="manifest" href="/assets/images/favicon/site.webmanifest" />
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <title>{{ page.title | default: site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.meta_description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ site.url }}/assets/images/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ site.url }}/assets/images/preview.png" />
  {% include schema.html %}
  <script defer src="https://cloud.umami.is/script.js" data-website-id="329e9609-9629-470b-82a1-942841cf745e"></script>
</head>
<body>
  <div class="flex flex-col min-h-screen bg-zinc-950">
    {% include navbar.html %}
    <main class="flex-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/contact-form.js"></script>
  <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d59fe414cbef428b9e80e29341869cdf"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
