<div data-form="proposal">
  <div data-success style="display:none" class="border border-zinc-700 bg-zinc-900 p-12 text-center flex flex-col items-center gap-5" role="alert" aria-live="polite">
    <img src="/assets/images/LafayetteSound_Logo.png" alt="Lafayette Sound" class="h-10" />
    <h2 class="text-2xl font-extrabold tracking-tight text-zinc-50">Message Received</h2>
    <p class="text-zinc-400 text-sm leading-relaxed max-w-sm">Thank you, <span data-first-name></span>. Our team will review your event details and reach out within one business day.</p>
  </div>

  <form aria-label="Contact form" novalidate>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

      <div class="flex flex-col gap-2">
        <label for="pf-name" class="text-sm font-medium text-zinc-300 tracking-wide">Full Name *</label>
        <input id="pf-name" name="name" type="text" autocomplete="name" placeholder="Jane Smith"
          data-required data-error-message="Full name is required."
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-zinc-50 placeholder-zinc-600 text-sm px-4 py-3 outline-none transition-colors duration-200"
          aria-required="true" />
        <p data-error="name" class="text-red-400 text-xs" role="alert" hidden></p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="pf-company" class="text-sm font-medium text-zinc-300 tracking-wide">Company Name *</label>
        <input id="pf-company" name="company" type="text" autocomplete="organization" placeholder="Acme Corporation"
          data-required data-error-message="Company name is required."
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-zinc-50 placeholder-zinc-600 text-sm px-4 py-3 outline-none transition-colors duration-200"
          aria-required="true" />
        <p data-error="company" class="text-red-400 text-xs" role="alert" hidden></p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="pf-email" class="text-sm font-medium text-zinc-300 tracking-wide">Work Email *</label>
        <input id="pf-email" name="email" type="email" autocomplete="email" placeholder="jane@company.com"
          data-required data-error-message="A valid work email is required."
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-zinc-50 placeholder-zinc-600 text-sm px-4 py-3 outline-none transition-colors duration-200"
          aria-required="true" />
        <p data-error="email" class="text-red-400 text-xs" role="alert" hidden></p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="pf-phone" class="text-sm font-medium text-zinc-300 tracking-wide">Phone</label>
        <input id="pf-phone" name="phone" type="tel" autocomplete="tel" placeholder="(765) 555-1234"
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-zinc-50 placeholder-zinc-600 text-sm px-4 py-3 outline-none transition-colors duration-200" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="pf-date" class="text-sm font-medium text-zinc-300 tracking-wide">Event Date *</label>
        <input id="pf-date" name="eventDate" type="date"
          data-required data-error-message="Approximate event date is required."
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-zinc-50 placeholder-zinc-600 text-sm px-4 py-3 outline-none transition-colors duration-200 [color-scheme:dark]"
          aria-required="true" />
        <p data-error="eventDate" class="text-red-400 text-xs" role="alert" hidden></p>
      </div>

      <div class="flex flex-col gap-2 relative" id="services-dropdown">
        <span class="text-sm font-medium text-zinc-300 tracking-wide">Services Needed *</span>
        <button type="button" id="services-toggle"
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-sm px-4 py-3 outline-none transition-colors duration-200 cursor-pointer flex items-center justify-between"
          aria-haspopup="listbox" aria-expanded="false">
          <span id="services-label" class="text-zinc-600">Select services</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-zinc-500 shrink-0 transition-transform duration-200" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="services-menu" class="absolute top-full left-0 right-0 mt-1 bg-zinc-800 border border-zinc-700 z-50 flex flex-col" style="display:none;" role="listbox" aria-multiselectable="true">
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Presentations" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Presentations</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Sound" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Sound</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Cameras & Video" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Cameras &amp; Video</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Live Streaming" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Live Streaming</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Staging" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Staging</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Lighting" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Lighting</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Installations" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Installations</span>
          </label>
          <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-zinc-700 cursor-pointer transition-colors duration-150">
            <input type="checkbox" name="services" value="Beverage & Hospitality" class="accent-red-600 w-4 h-4" />
            <span class="text-sm text-zinc-300">Beverage &amp; Hospitality</span>
          </label>
        </div>
        <p data-error="services" class="text-red-400 text-xs" role="alert" hidden></p>
      </div>

      <div class="sm:col-span-2 flex flex-col gap-2">
        <label for="pf-message" class="text-sm font-medium text-zinc-300 tracking-wide">Tell us about your event</label>
        <textarea id="pf-message" name="message" rows="5"
          placeholder="Describe your event — expected attendance, venue, special requirements, or anything else that helps us plan."
          class="w-full bg-zinc-800 border border-zinc-700 focus:border-red-600 text-zinc-50 placeholder-zinc-600 text-sm px-4 py-3 outline-none transition-colors duration-200 resize-none"></textarea>
      </div>

    </div>

    <div class="mt-8">
      <button type="submit" class="bg-red-600 hover:bg-red-700 text-zinc-50 text-sm font-semibold tracking-wide px-10 py-4 transition-colors duration-200 w-full sm:w-auto">Send Message</button>
      <p class="mt-4 text-zinc-600 text-xs">We typically respond within one business day. No spam &mdash; ever.</p>
    </div>
  </form>

  <script>
  (function(){
    var wrap = document.getElementById('services-dropdown');
    var toggle = document.getElementById('services-toggle');
    var menu = document.getElementById('services-menu');
    var label = document.getElementById('services-label');
    var checks = menu.querySelectorAll('input[type="checkbox"]');

    toggle.addEventListener('click', function(){
      var open = menu.style.display === 'none';
      menu.style.display = open ? 'flex' : 'none';
      toggle.setAttribute('aria-expanded', open);
      toggle.querySelector('svg').style.transform = open ? 'rotate(180deg)' : '';
    });

    document.addEventListener('click', function(e){
      if (!wrap.contains(e.target)) {
        menu.style.display = 'none';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.querySelector('svg').style.transform = '';
      }
    });

    checks.forEach(function(cb){
      cb.addEventListener('change', function(){
        var selected = [];
        checks.forEach(function(c){ if(c.checked) selected.push(c.value); });
        if (selected.length === 0) {
          label.textContent = 'Select services';
          label.className = 'text-zinc-600';
        } else {
          label.textContent = selected.join(', ');
          label.className = 'text-zinc-50';
        }
      });
    });
  })();
  </script>
</div>
